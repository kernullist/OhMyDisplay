name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: ./scripts/fetch-webview2.ps1

      - name: Build (${{ matrix.config }})
        shell: pwsh
        run: ./build.ps1 -Config ${{ matrix.config }}

      - name: Run test harness
        shell: pwsh
        run: ./build/omd_tests.exe

      - name: Upload binaries
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: OhMyDisplay-${{ matrix.config }}
          path: |
            build/OhMyDisplay.exe
            build/OhMyDisplay.Elevated.exe
          if-no-files-found: error
