name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create/release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing tag: $tag"

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: ./scripts/fetch-webview2.ps1

      - name: Build (Release)
        shell: pwsh
        run: ./build.ps1 -Config Release

      - name: Run test harness
        shell: pwsh
        run: ./build/omd_tests.exe

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $stage = "OhMyDisplay-$tag-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/OhMyDisplay.exe, build/OhMyDisplay.Elevated.exe, README.md, LICENSE $stage
          $zip = "$stage.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          gh release create $tag `
            "${{ steps.package.outputs.zip }}" `
            build/OhMyDisplay.exe `
            build/OhMyDisplay.Elevated.exe `
            --title "OhMyDisplay $tag" `
            --generate-notes
